name: Sync master requirements

on:
  push:
    branches:
      - automation/sharepoint-master
    paths:
      - docs/requirements/URC_2027_Lean_Master.xlsx
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  render-and-open-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/sharepoint-master

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install workbook reader
        run: python -m pip install --disable-pip-version-check openpyxl==3.1.5

      - name: Render and test requirements register
        run: |
          python scripts/sync_master_requirements.py \
            --workbook docs/requirements/URC_2027_Lean_Master.xlsx \
            --output docs/requirements/master-requirements.md
          python -m unittest discover -s tests -v

      - name: Commit generated register
        id: commit
        run: |
          if git diff --quiet -- docs/requirements/master-requirements.md; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/requirements/master-requirements.md
          git commit -m "docs: sync master requirements from SharePoint workbook"
          git push origin HEAD:automation/sharepoint-master
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Create or update review pull request
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: automation/sharepoint-master
        run: |
          existing="$(gh pr list --base main --head "$BRANCH" --state open --json number --jq '.[0].number')"
          if [ -z "$existing" ]; then
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "docs: sync master requirements from SharePoint" \
              --body "Generated from the latest SharePoint Lean Master workbook. Review the workbook and rendered Markdown before merging."
          else
            gh pr edit "$existing" \
              --title "docs: sync master requirements from SharePoint" \
              --body "Updated from the latest SharePoint Lean Master workbook. Review the workbook and rendered Markdown before merging."
          fi
